# Corpus manifest for pt-amb-rag.
#
# Every instrument the pipeline ingests is declared here. Adding a
# diploma is a manifest edit, not a code change.
#
# `source.tipo` and `source.key` are the two identifiers the DRE
# screenservice needs: `tipo` is the URL segment used by
# `/dr/detalhe/<tipo>/<key>` and `key` is the trailing identifier of
# that same URL.
#
# `source.eli` and `source.pdf_url` are the DRE's own canonical
# references for the same document. The PDF is the only artefact that
# carries the numeric tables of the anexos — the HTML served by the
# screenservice has no table markup at all — so a corpus that needs
# emission-limit values must also keep the PDF.
#
# `tags` drive the eval slices; `eval_tiers` lists the golden-set
# tiers the eval runner may be asked for.

language:
  code: pt-PT
  month_names:
    - janeiro
    - fevereiro
    - março
    - abril
    - maio
    - junho
    - julho
    - agosto
    - setembro
    - outubro
    - novembro
    - dezembro
  # The deterministic sentinel the assistant must reply with when the
  # corpus does not answer the question. It is matched by the judge
  # and by the unanswerable tier, so it must change atomically with
  # the prompts.
  abstention: "O corpus não responde a esta pergunta."
  citation_hint: >-
    Cite assim: [DL n.º 150/2015, art. 8.º, n.º 2, al. b)] ou
    [Portaria n.º 38/2025, anexo I]. Nunca cites só o diploma sem o
    artigo.

embedding:
  model: BAAI/bge-m3
  dimension: 1024
  collection: pt_amb_rag_v1

eval_tiers:
  - principal
  - unanswerable

