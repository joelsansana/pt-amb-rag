[project]
name = "pt-amb-rag"
version = "0.1.0"
description = "Eval-gated RAG over Portuguese environmental legislation (APA-administered instruments)"
authors = [
    { name = "Joel Sansana", email = "joelsansana@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.17.0",
    "pydantic>=2.13.5",
    "qdrant-client>=1.19.1",
    "requests>=2.34.2",
    "selectolax>=0.4.11",
    "sentence-transformers>=6.1.0",
    "sse-starlette>=3.4.11",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
pt-amb-rag = "pt_amb_rag:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These two modules hold LLM prompt templates. Their long lines are prose
# inside string literals, where `# noqa` cannot go and where rewrapping
# would silently change the prompt sent to the model — which would move
# the judge/golden-set numbers this repo reports.
"src/pt_amb_rag/eval/judge.py" = ["E501"]
"src/pt_amb_rag/eval/golden_generator.py" = ["E501"]
"src/pt_amb_rag/generation/prompts.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
extraPaths = ["scripts"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that hit the real MiniMax API (slow, needs MINIMAX_API_KEY)",
]
addopts = "-m 'not integration'"
pythonpath = ["scripts"]
