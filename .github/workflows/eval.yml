name: eval

on:
  pull_request:
    branches: [main]

jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras

      # Fresh Qdrant on every runner — must be populated before eval.
      - name: Start Qdrant
        run: docker run -d --rm -p 6333:6333 --name qdrant-ci qdrant/qdrant

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/collections && break
            sleep 2
          done

      # data/ is gitignored: rebuild the corpus from source in CI.
      # The fetch goes through the DRE screenservice API (see
      # src/pt_amb_rag/ingestion/dre.py); the manifest in corpora.yaml
      # declares every diploma that is fetched.
      - name: Fetch corpus from the Diário da República
        run: uv run python scripts/fetch_corpus.py

      # corpus_pins tests (already in the suite) fail loudly if the DRE
      # content drifted and the golden set's hashes went stale.
      - name: Verify corpus pins (golden-set lockstep)
        run: uv run python -m pytest tests/eval/test_corpus_pins.py -q

      - name: Build Qdrant index
        run: uv run python scripts/build_index.py

      - name: Assert index populated (points == chunks)
        run: |
          EXPECTED=$(cat data/processed/*.jsonl | grep -c .)
          ACTUAL=$(curl -sf http://localhost:6333/collections/pt_amb_rag_v1 \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['points_count'])")
          echo "indexed=$ACTUAL expected=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"

      - name: Eval principal tier (retrieval-only, no LLM)
        run: uv run python scripts/run_eval.py --tier principal --output eval_run_principal.json --summary-only --no-llm

      - name: Eval unanswerable tier (retrieval-only, no LLM)
        run: uv run python scripts/run_eval.py --tier unanswerable --output eval_run_unanswerable.json --summary-only --no-llm

      - name: Compare to main
        run: |
          uv run python scripts/eval_gate.py \
            --current eval_run_principal.json \
            --baseline-url https://raw.githubusercontent.com/joelsansana/pt-amb-rag/main/evals/results/baseline.json \
            --metric hit_at_5 \
            --tolerance 0.02
