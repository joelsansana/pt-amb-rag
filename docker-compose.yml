services:
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build: .
    depends_on:
      qdrant:
        condition: service_healthy
    ports: ["8000:8000"]
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
    command: >
      sh -c "python scripts/build_index.py &&
             python -m uvicorn pt_amb_rag.api.main:app --host 0.0.0.0 --port 8000"

volumes:
  qdrant_data:
  hf_cache:
